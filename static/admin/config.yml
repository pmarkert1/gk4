backend:
  name: git-gateway
  branch: master2

display_url: http://localhost:1313
site_url: http://localhost:1313/
media_folder: "static/images/uploads" # Media files will be stored in the repo under static/images/uploads
public_folder: "/images/uploads" # The src attribute for uploaded media will begin with /images/uploads

collections:
  - name: "shows" # Used in routes, e.g., /admin/collections/blog
    label: "Shows" # Used in the UI
    folder: "content/shows" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "{{title}}" # Filename template, e.g., YYYY-MM-DD-title.md
    fields: # The fields for each document, usually in front matter
      - { label: "Layout", name: "layout", widget: "hidden", default: "blog", required: false}
      - { label: "Title", name: "title", widget: "string", required: false}
      - { label: "Slug", name: "slug", widget: "string"}
      - { label: "Artist", name: "artist", widget: "string", required: false}
      - { label: "Runtime", name: "runtime", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Preview Image", name: "prevImage", widget: "image" }
      - { label: "Images", name: "images", widget: "list", required: false, 
          fields: 
            [
              { label: "Image", name: "src", widget: "image" },
              { label: "Caption", name: "caption", widget: "string", required: false },
                            { label: "Alt Tag", name: "alt", widget: "string", required: false }
            ] 
        }
      - { label: "Body", name: "body", widget: "markdown", required: false}


      - name: "index" # New collection for _index.md
    label: "Index Page"
    files:
      - label: "Index Page"
        name: "index"
        file: "content/_index.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

  - name: "footer" # New collection for footer.md
    label: "Footer"
    files:
      - label: "Footer"
        name: "footer"
        file: "content/footer.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }